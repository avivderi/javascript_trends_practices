<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>טקסט עגול מסתובב</title>
<style>
  body {
    background: #db1c1c;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .spin-element {
    -webkit-animation: spin 15s linear infinite;
    -moz-animation: spin 15s linear infinite;
    animation: spin 15s linear infinite;
  }

  @-moz-keyframes spin { 100% { -moz-transform: rotate(360deg); } }
  @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
  @keyframes spin {
    100% {
      -webkit-transform: rotate(360deg);
      transform: rotate(360deg);
    }
  }

  text {
    fill: #fff;
    font-size: 14px;
    font-family: Arial, sans-serif;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<svg class="spin-element" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <!-- מסלול עגול שהטקסט "ידבק" אליו -->
    <path id="circlePath"
          d="M 110,110 m -80,0 a 80,80 0 1,1 160,0 a 80,80 0 1,1 -160,0"
          fill="none" />
  </defs>

  <text>
    <textPath href="#circlePath" startOffset="0%">
      SCHOOLINER • DESIGN • CODE • SCHOOLINER • DESIGN • CODE •
    </textPath>
  </text>
</svg>

</body>
</html>
