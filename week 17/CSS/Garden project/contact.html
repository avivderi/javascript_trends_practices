<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הגינה של מיכל - יצירת קשר</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <div class="container-row">
        <nav class="menu">
            <a href="home.html">דף הבית</a>
            <a href="contact.html"><b>יצירת קשר</b></a>
        </nav>

        <div class="logo-store">
            <img src="https://design-factory.co.il/wp-content/uploads/2024/10/%D7%92%D7%99%D7%A0%D7%94.png" alt="לןגן של האתר"/>
        </div>
        </div>
    </header>

    <div class="container">
        <h1 class="title">
            יצירת קשר
        </h1>
        <h2 class="description">
            שלחו עכשיו את הטופס ונשמח לשוחח איתכם בהקדם!
        </h2>

        <section>
            <div class="data">
                <h4 class="num">כתובת</h4>
                <h5 class="str">רחוב הגפן 12</h5>
        </div>
        <div class="data">
            <h4 class="num">שעות פתיחה</h4>
            <h5 class="str">א'-ה' 09:00-19:00</h5>
        </div>
        <div class="data">
            <h4 class="num">שישי</h4>
            <h5 class="str">09:00-14:00</h5>
        </div>
        <div class="data">
            <h4 class="num">טלפון</h4>
            <h5 class="str">03-1234567</h5>
        </div>
        </section>

    <h3 class="new-title">בואו נדבר...</h3>

        <form class="forms" action="/api/contact">
            <label for="name">שם מלא *</label>
            <input type="text"
            required
            id="name"
            name="name"
            minlength="2"
            placeholder="מה השם שלך?"
            />

            <label for="email">אימייל *</label>
            <input type="email"
            name="email"
            id="email"
            required
            placeholder="מה האימייל שלך?"
            />

            <label for="what">מהי סיבת הפנייה? *</label>
            <select name="what" id="what">
                <option value="price">בירור מחירים</option>
                <option value="sratus">בירור סטטוס משלוח והזמנה קיימת</option>
                <option value="Events">הזמנה מותאמת אישית ועיצוב לאירועים</option>
            </select>

            <label for="text">הודעה</label>
            <textarea name="message"
            id="message"
            placeholder="תוכן ההודעה"
            rows="4"></textarea>
            
            <button type="submit">שלח טופס</button>
        </form>
    </div>

    <footer class="footer">
        <div class="logo-footer">
            <img src="https://design-factory.co.il/wp-content/uploads/2024/10/%D7%92%D7%99%D7%A0%D7%94.png"
                alt="לוגו של האתר" />
        </div>
    
        <div class="container-footer">
            <nav class="menu">
                <a href="home.html">דף הבית</a>
                <a href="contact.html">יצירת קשר</a>
            </nav>
        </div>
    </footer>
</body>
</html>
